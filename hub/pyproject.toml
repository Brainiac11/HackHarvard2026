[project]
name = "lunarhub"
version = "0.1.0"
description = "LunarHaptics hub: haptic engine, glove link, NFC identity, mission state, voice/agent bridges"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyserial>=3.5",
    "bleak>=0.22",
    "python-dotenv>=1.0",
    "pillow>=10",
    "lunar-agent",
]

[project.optional-dependencies]
nfc = ["pyscard>=2.0", "evdev>=1.7"]
chalk = ["chalkcompute"]

[tool.uv.sources]
lunar-agent = { path = "../agent", editable = true }

[project.scripts]
lunarhub = "lunarhub.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunarhub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
