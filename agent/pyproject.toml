[project]
name = "lunar-agent"
version = "0.1.0"
description = "LunarHaptics Mission Assistant: explains glove sensations and recommends actions (deployed on Chalk)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
chalk = ["chalkcompute", "openai>=1.40", "pyarrow>=15"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lunar_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
