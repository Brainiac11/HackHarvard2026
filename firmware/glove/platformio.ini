; LunarHaptics glove firmware. Arduino-ESP32 core 2.0.x (official espressif32 platform 6.x) + NimBLE 1.4.
; Build/flash:  pio run -e esp32dev -t upload     Monitor: pio device monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps = h2zero/NimBLE-Arduino@~1.4.3
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags} -DGLOVE_BOARD_CLASSIC

[env:esp32s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags} -DGLOVE_BOARD_S3 -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DGLOVE_BOARD_C3 -DARDUINO_USB_CDC_ON_BOOT=1
